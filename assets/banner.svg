<svg width="1600" height="380" viewBox="0 0 1600 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#0d0518"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4AE8FF"/>
      <stop offset="50%" stop-color="#7C6BFF"/>
      <stop offset="100%" stop-color="#FF4ADE"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4AE8FF"/>
      <stop offset="100%" stop-color="#FF4ADE"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="380" fill="url(#bgGrad)"/>

  <!-- circuit grid lines -->
  <g stroke="#1c2947" stroke-width="1" opacity="0.6">
    <line x1="0" y1="60" x2="1600" y2="60"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="1400" y1="0" x2="1400" y2="380"/>
  </g>
  <g stroke="#2a3a63" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M0,100 H120 L150,130 H320"/>
    <path d="M0,280 H100 L130,250 H300 L330,280 H480"/>
    <path d="M1600,100 H1480 L1450,130 H1290"/>
    <path d="M1600,280 H1500 L1470,250 H1310 L1280,280 H1140"/>
  </g>
  <g fill="#3aa0ff" opacity="0.8">
    <circle cx="150" cy="130" r="3"/>
    <circle cx="320" cy="130" r="3"/>
    <circle cx="130" cy="250" r="3"/>
    <circle cx="330" cy="280" r="3"/>
    <circle cx="1450" cy="130" r="3"/>
    <circle cx="1470" cy="250" r="3"/>
  </g>

  <!-- H logo -->
  <g transform="translate(150,190)">
    <circle r="95" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.9" filter="url(#softGlow)"/>
    <circle r="75" fill="none" stroke="#4AE8FF" stroke-width="1" opacity="0.4"/>
    <circle r="112" fill="none" stroke="#FF4ADE" stroke-width="1" opacity="0.3" stroke-dasharray="4 8"/>
    <text x="0" y="26" font-family="Arial, sans-serif" font-size="72" font-weight="bold"
          fill="#eafcff" text-anchor="middle" filter="url(#glow)">H</text>
  </g>

  <!-- Title -->
  <text x="330" y="175" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold"
        fill="url(#titleGrad)" filter="url(#glow)">Harishwaran T</text>

  <!-- Subtitle -->
  <text x="333" y="220" font-family="'Courier New', monospace" font-size="24" letter-spacing="6"
        fill="#8fe8ff" opacity="0.9">CODE &#8226; BUILD &#8226; DEPLOY &#8226; REPEAT</text>

  <!-- Tag line -->
  <text x="333" y="270" font-family="Arial, sans-serif" font-size="19"
        fill="#a9b8d8" opacity="0.85">Robotics &#160;|&#160; ROS2 &#160;|&#160; Autonomous Systems &#160;|&#160; Computer Vision &#160;|&#160; AI &#160;|&#160; Embedded Systems</text>

  <!-- Focus tag -->
  <text x="333" y="305" font-family="Arial, sans-serif" font-size="17" font-style="italic"
        fill="#6f7fa8">Building intelligent machines that can sense, think, and act.</text>

  <!-- accent brackets -->
  <text x="1520" y="230" font-family="Arial, sans-serif" font-size="46" fill="#FF4ADE" opacity="0.55" filter="url(#softGlow)">&gt;&gt;&gt;</text>
</svg>
